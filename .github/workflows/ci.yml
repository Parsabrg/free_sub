name: Regression and real local Xray end-to-end tests
on:
  push:
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python download_xray.py
      - name: Actual Xray traffic through loopback Trojan TLS and HTTPS fixtures
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python verify.py --xray tools/xray.exe
          else
            python verify.py --xray tools/xray
          fi
      - name: Parse PowerShell scripts without executing or registering tasks
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
